<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گالری رسانه‌ای من</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <button id="homeBtn" title="خانه">⌂</button>
  <h1>گالری رسانه‌ای من</h1>
  <button id="adminBtn" title="مدیریت">👤</button>
</header>

<main>
  <section id="loginPanel" class="panel hidden">
    <h2>ورود مدیریت</h2>
    <input id="username" placeholder="نام کاربری">
    <input id="password" type="password" placeholder="رمز عبور">
    <button id="loginBtn">ورود</button>
    <p id="loginMessage"></p>
  </section>

  <section id="adminPanel" class="panel hidden">
    <h2>مدیریت رسانه‌ها</h2>

    <label class="upload">
      📷 افزودن عکس یا فیلم
      <input id="mediaInput" type="file" accept="image/*,video/*" multiple hidden>
    </label>

    <label class="upload">
      🎵 افزودن صدا
      <input id="audioInput" type="file" accept="audio/*" multiple hidden>
    </label>

    <button id="addTextBtn">📝 افزودن متن</button>
    <button id="logoutBtn">خروج از مدیریت</button>
    <button id="deleteBtn" class="danger">حذف رسانه</button>
  </section>

  <section class="panel">
    <h2>🖼️ عکس و فیلم</h2>
    <div id="mediaFrame" class="media-frame">
      <p>یک عکس یا فیلم انتخاب کن</p>
    </div>
    <div id="mediaGallery" class="gallery"></div>
  </section>

  <section class="panel">
    <h2>🎵 بخش صدا</h2>
    <div id="audioGallery" class="audio-gallery"></div>
  </section>

  <section class="panel">
    <h2>📝 نوشته‌ها</h2>
    <div id="textGallery"></div>
  </section>
</main>

<footer>ساخته‌شده با ❤️</footer>

<script src="script.js"></script>
</body>
</html>
