body {

}

.media-frame img,
.media-frame video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.placeholder {
  color: #888;
  font-size: 14px;
}

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

  flex: 1;
  border: 0;
  border-radius: 8px;
  padding: 12px 8px;
  font-size: 14px;
  cursor: pointer;
}

.add {
  background: #eee;
  font-size: 22px;
}

.save {
  background: #20a464;
  color: white;
}

.delete {
  background: #e53935;
  color: white;
}

  display: none;
}
