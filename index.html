<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سایت رسانه‌ای من</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<button id="loginIcon" onclick="login()">♙</button>

<div class="container">
  <h1>گالری رسانه‌ای من</h1>

  <div class="media-frame" id="mediaFrame">
    <div class="placeholder">هنوز عکسی یا فیلمی ثبت نشده است</div>
  </div>

  <div id="adminPanel" class="buttons">
    <button class="add" onclick="document.getElementById('fileInput').click()">＋</button>
    <button class="save" onclick="saveMedia()">ثبت</button>
    <button class="delete" onclick="deleteMedia()">حذف</button>
  </div>

  <input type="file" id="fileInput" accept="image/*,video/*">

  <h2>گالری عکس و فیلم</h2>
  <div id="gallery"></div>

  <div class="audio-panel">
    <h2>بخش صوت</h2>
    <input type="file" id="audioInput" accept="audio/*">
    <button class="save" onclick="saveAudio()">ثبت صوت</button>
    <div id="audioGallery" class="media-list"></div>
  </div>

  <div class="text-panel">
    <h2>بخش متن</h2>
    <textarea id="textInput" maxlength="10000" placeholder="متن خود را بنویس..."></textarea>
    <button class="save" onclick="saveText()">ثبت متن</button>
    <div id="textGallery" class="media-list"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
